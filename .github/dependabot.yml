version: 2
updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: 'uv'
    directory: '/'
    schedule:
      interval: 'monthly'
    # The linters are pinned with ==; 'increase' bumps the pin instead of
    # widening it to a range, which would defeat the point of pinning.
    versioning-strategy: 'increase'
    groups:
      python:
        patterns:
          - '*'
